<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sotag – Simple Shopping App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🛒 Sotag</h1>
    <button id="cart-btn" aria-label="Open cart">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <main>
    <section id="products">
      <h2>Products</h2>
      <div id="product-grid" class="grid"></div>
    </section>

    <aside id="cart-panel" hidden>
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <p id="cart-empty">Your cart is empty.</p>
      <div id="cart-footer">
        <strong>Total: $<span id="cart-total">0.00</span></strong>
        <button id="checkout-btn">Checkout</button>
      </div>
    </aside>
  </main>

  <div id="toast" role="alert" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
